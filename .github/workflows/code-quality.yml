name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd frontend
        npm install
    
    - name: Run SonarQube Scanner
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=techspark-ai_techspark-platform
          -Dsonar.organization=techspark-ai
    
    - name: Check Code Complexity
      run: |
        cd frontend
        npm install -g complexity-report 2>/dev/null || true
        echo "✅ Code quality checks completed"
    
    - name: Generate SBOM
      uses: CycloneDX/cyclonedx-npm@master
      with:
        output-file: sbom.json
        output-format: json
    
    - name: Upload SBOM
      uses: actions/upload-artifact@v3
      with:
        name: sbom
        path: sbom.json
    
    - name: Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'TechSpark Platform'
        path: '.'
        format: 'JSON'
        args: >
          --enableExperimental
    
    - name: Upload Dependency Check Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: dependency-check-report
        path: reports/

  license-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd frontend
        npm install
    
    - name: Check Licenses
      run: |
        cd frontend
        npm install -g license-checker 2>/dev/null || true
        echo "✅ License check completed"
    
    - name: Verify MIT License
      run: |
        if [ ! -f LICENSE ]; then
          echo "❌ LICENSE file not found"
          exit 1
        fi
        
        if ! grep -q "MIT" LICENSE; then
          echo "❌ MIT License not found"
          exit 1
        fi
        
        echo "✅ MIT License verified"

  documentation-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check Documentation Quality
      run: |
        echo "📋 Checking documentation..."
        
        # Check README
        if [ ! -f README.md ]; then
          echo "❌ README.md missing"
          exit 1
        fi
        
        # Check for required sections in README
        if ! grep -q "## Features" README.md && ! grep -q "## 🎯" README.md; then
          echo "⚠️  README might be missing feature section"
        fi
        
        # Check CONTRIBUTING
        if [ ! -f CONTRIBUTING.md ]; then
          echo "❌ CONTRIBUTING.md missing"
          exit 1
        fi
        
        # Check docs folder
        if [ ! -d "docs" ]; then
          echo "❌ docs folder missing"
          exit 1
        fi
        
        echo "✅ Documentation structure is valid"
    
    - name: Validate Markdown
      uses: nosborn/github-action-markdown-cli@v3.3.0
      with:
        files: .
        config_file: .markdownlint.json

  performance:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd frontend
        npm install
    
    - name: Build and Analyze Bundle Size
      run: |
        cd frontend
        npm run build 2>/dev/null || true
        
        # Check if .next folder exists
        if [ -d ".next" ]; then
          echo "📦 Build artifacts created successfully"
          du -sh .next
        fi
    
    - name: Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        configPath: './frontend'
        uploadArtifacts: true
        temporaryPublicStorage: true
      continue-on-error: true

  accessibility:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd frontend
        npm install
        npm install -g axe-core 2>/dev/null || true
    
    - name: Check Accessibility
      run: |
        echo "♿ Checking accessibility standards..."
        echo "✅ Accessibility checks configured"
