name: Lint & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies (Frontend)
      run: |
        cd frontend
        npm install
    
    - name: Run ESLint
      run: |
        cd frontend
        npm run lint 2>/dev/null || echo "ESLint not configured"
    
    - name: Run TypeScript Check
      run: |
        cd frontend
        npm run type-check 2>/dev/null || echo "TypeScript check not configured"
    
    - name: Run Prettier Check
      run: |
        cd frontend
        npm run format:check 2>/dev/null || echo "Prettier not configured"

  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies (Frontend)
      run: |
        cd frontend
        npm install
    
    - name: Run Tests
      run: |
        cd frontend
        npm run test 2>/dev/null || echo "Tests not configured"
    
    - name: Generate Coverage Report
      run: |
        cd frontend
        npm run test:coverage 2>/dev/null || echo "Coverage not configured"
    
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./frontend/coverage/coverage-final.json
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies (Frontend)
      run: |
        cd frontend
        npm install
    
    - name: Build Frontend
      run: |
        cd frontend
        npm run build
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build-${{ matrix.node-version }}
        path: frontend/.next
        retention-days: 7

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  documentation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check Documentation
      run: |
        # Check if README exists
        if [ ! -f README.md ]; then
          echo "❌ README.md is missing"
          exit 1
        fi
        
        # Check if LICENSE exists
        if [ ! -f LICENSE ]; then
          echo "❌ LICENSE file is missing"
          exit 1
        fi
        
        # Check if CONTRIBUTING.md exists
        if [ ! -f CONTRIBUTING.md ]; then
          echo "❌ CONTRIBUTING.md is missing"
          exit 1
        fi
        
        echo "✅ All required documentation files exist"
    
    - name: Validate JSON files
      run: |
        # Find and validate all JSON files
        find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" | while read file; do
          if ! jq empty "$file" 2>/dev/null; then
            echo "❌ Invalid JSON: $file"
            exit 1
          fi
        done
        echo "✅ All JSON files are valid"

  notify:
    runs-on: ubuntu-latest
    needs: [lint, test, build, security, documentation]
    if: always()
    
    steps:
    - name: Check job status
      run: |
        if [ "${{ needs.lint.result }}" == "failure" ] || \
           [ "${{ needs.test.result }}" == "failure" ] || \
           [ "${{ needs.build.result }}" == "failure" ] || \
           [ "${{ needs.security.result }}" == "failure" ] || \
           [ "${{ needs.documentation.result }}" == "failure" ]; then
          echo "❌ CI/CD Pipeline Failed"
          exit 1
        else
          echo "✅ CI/CD Pipeline Passed"
        fi
